<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:sans-serif;padding:20px">
  <button onclick="t('আসসালামু আলাইকুম, আপনি কেমন আছেন?','bn')">বাংলা</button>
  <button onclick="t('Hello, how are you?','en')">English</button>
  <button onclick="t('مرحبا كيف حالك','ar')">العربية</button>
  <p id="msg"></p>
  <script src="voice.js"></script>
  <script>
    async function t(text, lang) {
      msg.textContent = "লোড হচ্ছে...";
      try { await speakCloud(text, lang); msg.textContent = "হয়েছে ✅"; }
      catch (e) { msg.textContent = "এরর: " + e.message; }
    }
  </script>
</body>
</html>
